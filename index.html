<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost Management Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f4ef;
    --surface:#ffffff;
    --surface-2:#ecebe3;
    --surface-3:#e2e0d5;
    --border:#dcd9cd;
    --text:#211f1a;
    --text-muted:#6c6a60;
    --accent:#2f6f4e;
    --accent-strong:#20543a;
    --accent-soft:#e3ece6;
    --accent-contrast:#ffffff;
    --danger:#a83c34;
    --danger-soft:#f4e0dd;
    --warning:#9a6a15;
    --warning-soft:#f2e6cd;
    --ok-soft:#e3e6df;
    --ok-text:#5c6157;
    --shadow: 0 1px 2px rgba(30,28,20,0.06), 0 8px 24px -12px rgba(30,28,20,0.18);
    --radius: 10px;
    --focus: #2f6f4e;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141815;
      --surface:#1b211d;
      --surface-2:#212820;
      --surface-3:#2a3128;
      --border:#333c33;
      --text:#eae7dd;
      --text-muted:#a4a89b;
      --accent:#63b384;
      --accent-strong:#8ccca7;
      --accent-soft:#213a2c;
      --accent-contrast:#0e1712;
      --danger:#e08a7f;
      --danger-soft:#3a2521;
      --warning:#e0b45f;
      --warning-soft:#392e18;
      --ok-soft:#252b25;
      --ok-text:#a4a89b;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.6);
      --focus: #8ccca7;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141815;
    --surface:#1b211d;
    --surface-2:#212820;
    --surface-3:#2a3128;
    --border:#333c33;
    --text:#eae7dd;
    --text-muted:#a4a89b;
    --accent:#63b384;
    --accent-strong:#8ccca7;
    --accent-soft:#213a2c;
    --accent-contrast:#0e1712;
    --danger:#e08a7f;
    --danger-soft:#3a2521;
    --warning:#e0b45f;
    --warning-soft:#392e18;
    --ok-soft:#252b25;
    --ok-text:#a4a89b;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.6);
    --focus: #8ccca7;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:"Archivo","Source Sans 3",sans-serif;
    text-wrap:balance;
    letter-spacing:-0.01em;
  }
  button{ font-family:inherit; }
  input,textarea,select{ font-family:inherit; font-size:inherit; color:inherit; }
  .tabular{ font-variant-numeric: tabular-nums; }
  a{ color:var(--accent); }
  ::selection{ background:var(--accent-soft); }

  /* ---------- layout shell ---------- */
  .app{
    max-width:1180px;
    margin:0 auto;
    padding: 20px 20px 64px;
  }
  header.top{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    padding:16px 20px 14px;
    margin: 0 -20px 18px;
    border-bottom:1px solid var(--border);
  }
  .top-inner{
    max-width:1180px; margin:0 auto;
    display:flex; flex-wrap:wrap; align-items:center; gap:12px 16px;
  }
  .brand{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; flex:1 1 auto; min-width:200px; }
  .brand img.logo{ height:140px; width:auto; display:block; flex:none; background:#fff; border-radius:11px; padding:11px 20px; }
  .brand .brand-text{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .brand h1{ font-size:22px; font-weight:800; margin:0; }
  .brand .sub{ color:var(--text-muted); font-size:13px; }
  .tabs{ display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:999px; }
  .tabs button{
    border:none; background:transparent; padding:7px 16px; border-radius:999px;
    font-weight:600; font-size:13.5px; color:var(--text-muted); cursor:pointer;
  }
  .tabs button.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow); }
  .top-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .search{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:7px 12px; min-width:190px;
  }
  .search input{ border:none; outline:none; background:transparent; width:100%; color:var(--text); }
  .search svg{ flex:none; opacity:.55; }
  .btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    padding:8px 14px; border-radius:8px; font-weight:600; font-size:13.5px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn:hover{ background:var(--surface-2); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); }
  .btn.primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn.danger{ color:var(--danger); }
  .btn.ghost{ border-color:transparent; background:transparent; }
  .btn.ghost:hover{ background:var(--surface-2); }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, .chip:focus-visible{
    outline:2px solid var(--focus); outline-offset:2px;
  }
  .btn[disabled]{ opacity:.5; cursor:not-allowed; }

  .you{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); }
  .you input{
    border:1px solid var(--border); background:var(--surface); border-radius:6px;
    padding:5px 8px; width:112px; color:var(--text);
  }

  .banner{
    background:var(--warning-soft); color:var(--warning); border:1px solid var(--warning);
    border-radius:8px; padding:10px 14px; font-size:13.5px; margin-bottom:16px;
  }

  /* ---------- bucket groups + card grid ---------- */
  .bucket{ margin-bottom:28px; }
  .bucket-head{
    display:flex; align-items:baseline; gap:10px; margin-bottom:10px;
  }
  .bucket-head h2{ font-size:15px; margin:0; text-transform:uppercase; letter-spacing:.06em; }
  .bucket-head .count{ color:var(--text-muted); font-size:13px; }
  .bucket-head.overdue h2{ color:var(--danger); }
  .bucket-head.soon h2{ color:var(--warning); }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
    gap:12px;
  }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 14px 12px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:10px;
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover{ box-shadow:var(--shadow); border-color:var(--text-muted); }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .card-address{ font-family:"Archivo",sans-serif; font-weight:700; font-size:16px; line-height:1.25; }
  .pill{
    display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:3px 9px;
    font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap;
  }
  .pill.overdue{ background:var(--danger-soft); color:var(--danger); }
  .pill.soon{ background:var(--warning-soft); color:var(--warning); }
  .pill.later{ background:var(--surface-2); color:var(--text-muted); }
  .pill.none{ background:var(--surface-2); color:var(--text-muted); }
  .pill.outcome-sold{ background:var(--accent-soft); color:var(--accent-strong); }
  .pill.outcome-notSold{ background:var(--surface-3); color:var(--text); }
  .pill.imported{ background:var(--surface-2); color:var(--text-muted); font-weight:600; }
  .pill.assigned{ background:var(--accent-soft); color:var(--accent-strong); }

  .progress-row{ display:flex; align-items:center; gap:8px; }
  .progress-track{ flex:1; height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:999px; }
  .progress-label{ font-size:12px; color:var(--text-muted); white-space:nowrap; }
  .card-meta{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--text-muted); }

  .empty{
    border:1px dashed var(--border); border-radius:var(--radius); padding:36px 20px; text-align:center; color:var(--text-muted);
  }

  /* ---------- archive table ---------- */
  .archive-list{ display:flex; flex-direction:column; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .arow{
    display:grid; grid-template-columns: 1fr 110px 130px 32px;
    gap:10px; align-items:center; padding:10px 14px; background:var(--surface);
    border-bottom:1px solid var(--border); cursor:pointer; font-size:13.5px;
  }
  .arow:last-child{ border-bottom:none; }
  .arow:hover{ background:var(--surface-2); }
  .arow .addr{ font-weight:600; }
  .arow .date{ color:var(--text-muted); }
  @media (max-width:560px){
    .arow{ grid-template-columns: 1fr 32px; }
    .arow .date, .arow .outcome-cell{ display:none; }
  }

  /* ---------- drawer ---------- */
  .scrim{
    position:fixed; inset:0; background:rgba(20,20,16,0.35); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .scrim.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:min(560px,100vw);
    background:var(--surface); border-left:1px solid var(--border); z-index:41;
    transform:translateX(100%); transition:transform .2s ease;
    display:flex; flex-direction:column;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{
    display:flex; align-items:flex-start; gap:10px; padding:16px 16px 12px; border-bottom:1px solid var(--border);
  }
  .drawer-head input.addr-input{
    font-family:"Archivo",sans-serif; font-weight:700; font-size:19px; border:none; background:transparent;
    color:var(--text); width:100%; padding:2px 0;
  }
  .drawer-body{ padding:14px 16px 90px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:20px; }
  .drawer-body > *{ flex:none; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:460px){ .field-row{ grid-template-columns:1fr; } }
  label.field-label{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); display:block; margin-bottom:4px; }
  .field input[type="date"], .field textarea, .field input[type="text"]{
    width:100%; border:1px solid var(--border); background:var(--surface); border-radius:7px; padding:8px 10px; color:var(--text);
  }
  .field textarea{ min-height:56px; resize:vertical; }

  .segmented{ display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .segmented button{
    flex:1; border:none; background:var(--surface); color:var(--text-muted); padding:8px 6px; font-size:13px; font-weight:600; cursor:pointer;
    border-right:1px solid var(--border);
  }
  .segmented button:last-child{ border-right:none; }
  .segmented button.active{ background:var(--accent-soft); color:var(--accent-strong); }

  .section{ border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .section-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px;
    background:var(--surface-2); cursor:pointer; user-select:none;
  }
  .section-head h3{ font-size:13.5px; margin:0; font-weight:700; }
  .section-head .meta{ display:flex; align-items:center; gap:8px; }
  .section-head .frac{ font-size:12px; color:var(--text-muted); }
  .chev{ transition:transform .15s ease; opacity:.6; }
  .section.collapsed .chev{ transform:rotate(-90deg); }
  .section-items{ padding:6px 6px 10px; }
  .section.collapsed .section-items, .section.collapsed .add-item-row{ display:none; }
  .item-row{ display:flex; align-items:flex-start; gap:8px; padding:6px 8px; border-radius:6px; }
  .item-row:hover{ background:var(--surface-2); }
  .item-row input[type="checkbox"]{ margin-top:3px; width:16px; height:16px; accent-color:var(--accent); flex:none; }
  .item-text{ flex:1; font-size:13.5px; }
  .item-row.done .item-text{ color:var(--text-muted); text-decoration:line-through; }
  .item-done-meta{ font-size:11px; color:var(--text-muted); margin-top:2px; }
  .item-remove{ opacity:0; border:none; background:transparent; color:var(--text-muted); cursor:pointer; padding:2px 4px; flex:none; }
  .item-row:hover .item-remove{ opacity:1; }
  .add-item-row{ display:flex; gap:6px; padding:6px 8px 8px; }
  .add-item-row input{ flex:1; border:1px solid var(--border); background:var(--surface); border-radius:6px; padding:6px 9px; color:var(--text); font-size:13px; }

  .comment{ padding:8px 0; border-bottom:1px solid var(--border); }
  .comment:last-child{ border-bottom:none; }
  .comment .who{ font-weight:700; font-size:13px; }
  .comment .when{ color:var(--text-muted); font-size:11.5px; margin-left:6px; }
  .comment .body{ font-size:13.5px; margin-top:2px; white-space:pre-wrap; }
  .comment-add{ display:flex; gap:8px; margin-top:10px; }
  .comment-add textarea{ flex:1; min-height:44px; }

  .drawer-footer{
    position:absolute; left:0; right:0; bottom:0; padding:12px 16px; background:var(--surface);
    border-top:1px solid var(--border); display:flex; gap:8px; justify-content:space-between;
  }

  .modal-scrim{ position:fixed; inset:0; background:rgba(20,20,16,0.4); z-index:50; display:flex; align-items:flex-start; justify-content:center; padding:8vh 16px; }
  .modal{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow);
    width:min(440px,100%); padding:20px; display:flex; flex-direction:column; gap:14px;
  }
  .modal h2{ margin:0; font-size:18px; }
  .modal .field{ display:flex; flex-direction:column; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg);
    padding:9px 16px; border-radius:8px; font-size:13px; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .toast.show{ opacity:1; }

  .name-hint{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  .pm-label-row{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .link-btn{ border:none; background:none; color:var(--accent-strong); font-size:12px; font-weight:600; cursor:pointer; padding:0; text-decoration:underline; }
  .staff-list{ display:flex; flex-direction:column; gap:4px; max-height:300px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; padding:6px; }
  .staff-row{ display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:6px; font-size:13.5px; }
  .staff-row:hover{ background:var(--surface-2); }
  .staff-row .who{ flex:1; min-width:0; }
  .staff-row .em{ color:var(--text-muted); font-size:12px; overflow-wrap:anywhere; }
  .staff-row button{ border:1px solid var(--border); background:var(--surface); color:var(--danger); border-radius:6px; padding:3px 9px; font-size:12px; font-weight:600; cursor:pointer; flex:none; }
  .modal input[type=text], .modal input[type=email], .modal input[type=password]{ border:1px solid var(--border); background:var(--surface); border-radius:7px; padding:8px 10px; color:var(--text); font-size:14px; }
  .pin-error{ color:var(--danger); font-size:12.5px; min-height:16px; }
  .migrate-box{
    max-width:640px; margin:60px auto; padding:24px; border:1px solid var(--border); border-radius:var(--radius);
    background:var(--surface); font-size:14px;
  }
  .migrate-box h1{ font-size:18px; margin-top:0; }
  .migrate-log{ background:var(--surface-2); border-radius:8px; padding:10px 12px; max-height:320px; overflow-y:auto; font-family:monospace; font-size:12.5px; white-space:pre-wrap; }
</style>
</head>
<body>

<div class="app" id="mainApp">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <img class="logo" src="logo.png" alt="Waikato Real Estate">
        <div class="brand-text">
          <h1>Lost Management Tracker</h1>
          <span class="sub" id="headerCount"></span>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button id="tabActiveBtn" class="active" role="tab" aria-selected="true">Active</button>
        <button id="tabArchiveBtn" role="tab" aria-selected="false">Archive</button>
      </div>
      <div class="top-actions">
        <label class="search">
          <span class="visually-hidden">Search by address</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="searchInput" type="text" placeholder="Search address…" autocomplete="off">
        </label>
        <button class="btn primary" id="newPropertyBtn">+ New property</button>
        <div class="you">
          You:
          <input id="youInput" type="text" placeholder="your name" autocomplete="off">
        </div>
      </div>
    </div>
  </header>

  <div id="syncBanner" class="banner" style="display:none;">
    Couldn’t connect to the shared database — changes you make here won’t be saved or shared. Try reloading the page; if it keeps happening, let Natalie know.
  </div>

  <main id="mainActive"></main>
  <main id="mainArchive" style="display:none;"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<!-- Firebase (compat SDK — keeps the same collection().doc() style API) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script>
(function(){
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyCN55qBo8TyuDSOYSUSUJkBokII4Hwu8IE",
    authDomain: "wre---lost-mangements.firebaseapp.com",
    projectId: "wre---lost-mangements",
    storageBucket: "wre---lost-mangements.firebasestorage.app",
    messagingSenderId: "498963231685",

  };

  // ---- Assignment email: opens a ready-written message in the sender's own mail app ----
  var TRACKER_URL = "https://waikato-real-estate.github.io/Lost-Management-Tracker/";

  function assignmentEmailParts(property, staffMember){
    var first = (staffMember.name || "").split(" ")[0];
    var address = property.address || "(no address)";
    var subject = "Lost management tasks to complete: " + address;
    var cardLink = TRACKER_URL + "#p=" + encodeURIComponent(property.id);
    var body = "Hi " + first + ",\n\n" +
      "You've been assigned the lost management tasks for:\n\n" +
      address + "\n\n" +
      "Click here to open the checklist for this property:\n" +
      cardLink + "\n\n" +
      "Thanks!";
    return { subject: subject, body: body };
  }
  function mailtoHref(property, staffMember){
    var m = assignmentEmailParts(property, staffMember);
    return "mailto:" + staffMember.email + "?subject=" + encodeURIComponent(m.subject) + "&body=" + encodeURIComponent(m.body);
  }
  function outlookWebHref(property, staffMember){
    var m = assignmentEmailParts(property, staffMember);
    return "https://outlook.office.com/mail/deeplink/compose?to=" + encodeURIComponent(staffMember.email) +
      "&subject=" + encodeURIComponent(m.subject) + "&body=" + encodeURIComponent(m.body);
  }

  // Default list — used only until Natalie saves a list from the tracker (then the list lives in the database).
  var DEFAULT_STAFF = [
    { name:"Ashleigh Muir", email:"ashleigh@wre.co.nz" },

  // Shared settings (staff list + admin PIN hash) live in one reserved doc inside the

  var SETTINGS_ID = "__settings__";
  var settings = {};
  var ADMIN_KEY = "lmt_admin_unlocked";
  function isUnlocked(){ try { return sessionStorage.getItem(ADMIN_KEY) === (settings.adminPinHash || "x"); } catch(e){ return false; } }

  async function sha256(text){
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("wre-lmt:" + text));
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
  }

  /* ============================== state ============================== */

  var state = {
    properties: [],
    tab: "active",
    search: "",
    drawerId: null,
    dbApi: null,
    dbReady: false
  };

  var YOU_KEY = "lm_tracker_you_name";
  function getYou(){ try { return localStorage.getItem(YOU_KEY) || ""; } catch(e){ return ""; } }
  function setYou(v){ try { localStorage.setItem(YOU_KEY, v); } catch(e){} }

  function nowIso(){ return new Date().toISOString(); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function fmtDate(s){
    if(!s) return "No date set";
    var parts = s.split("-");
    if(parts.length!==3) return s;
    var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    return d.toLocaleDateString("en-NZ", { day:"numeric", month:"short", year:"numeric" });
  }
  function fmtDateTime(iso){
    if(!iso) return "";
    var d = new Date(iso);
    return d.toLocaleDateString("en-NZ",{day:"numeric",month:"short",year:"numeric"}) + " · " + d.toLocaleTimeString("en-NZ",{hour:"numeric",minute:"2-digit"});
  }
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function bucketOf(p){
    if(p.status === "archived") return "archived";
    if(!p.terminationDate) return "nodate";
    if(p.terminationDate < todayStr()) return "overdue";
    var today = new Date();
    var d = new Date(p.terminationDate + "T00:00:00");
    var sameMonth = d.getFullYear()===today.getFullYear() && d.getMonth()===today.getMonth();
    if(sameMonth) return "thismonth";
    var nm = new Date(today.getFullYear(), today.getMonth()+1, 1);
    if(d.getFullYear()===nm.getFullYear() && d.getMonth()===nm.getMonth()) return "nextmonth";
    return "later";
  }
  var BUCKET_ORDER = ["overdue","thismonth","nextmonth","later","nodate"];
  var BUCKET_LABEL = { overdue:"Overdue", thismonth:"This month", nextmonth:"Next month", later:"Later", nodate:"No date set" };

  function visibleChecklists(p){
    return (p.checklists||[]).filter(function(c){
      if(!c.showWhen) return true;
      return c.showWhen === p.outcome;
    });
  }
  function progressOf(p){
    var items = [];
    visibleChecklists(p).forEach(function(c){ items = items.concat(c.items||[]); });
    var done = items.filter(function(i){ return i.done; }).length;
    return { done: done, total: items.length, pct: items.length ? Math.round(100*done/items.length) : 0 };
  }

  /* ============================== db wiring (Firebase Firestore) ============================== */

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  function initDb(){
    try {
      firebase.initializeApp(firebaseConfig);
      var db = firebase.firestore();
      state.dbApi = db;
      state.dbReady = true;
      db.collection("properties").limit(1000).onSnapshot(function(snap){
        var settingsDoc = snap.docs.find(function(d){ return d.id === SETTINGS_ID; });
        settings = settingsDoc ? settingsDoc.data() : {};
        STAFF = (settings.staff && settings.staff.length) ? settings.staff.slice() : DEFAULT_STAFF.slice();
        state.properties = snap.docs.filter(function(d){ return d.id !== SETTINGS_ID; })
          .map(function(d){ return Object.assign({id:d.id}, d.data()); });
        renderStaffModalList();
        openDeepLinkedCard();
        renderAll();
      }, function(err){
        console.error("db error", err);
        document.getElementById("syncBanner").style.display = "block";
      });
    } catch(e){
      console.error(e);
      document.getElementById("syncBanner").style.display = "block";
      renderAll();
    }
  }

  async function createProperty(data){
    if(!state.dbApi){ toast("Can’t save — not connected"); return; }
    try {
      await state.dbApi.collection("properties").add(data);
      toast("Property added");
    } catch(e){ console.error(e); toast("Couldn’t save that property"); }
  }
  async function patchProperty(id, patch){
    if(!state.dbApi){ toast("Can’t save — not connected"); return; }
    try { await state.dbApi.collection("properties").doc(id).update(patch); }
    catch(e){ console.error(e); toast("Couldn’t save that change"); }
  }
  async function deleteProperty(id){
    if(!state.dbApi){ toast("Can’t delete — not connected"); return; }
    try { await state.dbApi.collection("properties").doc(id).delete(); toast("Property deleted"); }
    catch(e){ console.error(e); toast("Couldn’t delete that property"); }
  }

  function findProp(id){
    return state.properties.find(function(p){ return p.id === id; });
  }

  // Deep link: https://.../#p=<propertyId> opens that card straight away (once).
  var deepLinkHandled = false;
  function openDeepLinkedCard(){
    if(deepLinkHandled) return;
    var m = /[#&?]p=([^&]+)/.exec(window.location.hash || "");
    if(!m){ deepLinkHandled = true; return; }
    var id = decodeURIComponent(m[1]);
    var p = findProp(id);
    if(!p){
      if(state.properties.length){ deepLinkHandled = true; toast("Couldn’t find that property — it may have been deleted"); }
      return;
    }
    deepLinkHandled = true;
    var wantTab = p.status === "archived" ? "archive" : "active";
    if(state.tab !== wantTab){
      document.getElementById(wantTab === "archive" ? "tabArchiveBtn" : "tabActiveBtn").click();
    }
    openDrawer(id);
  }

  /* ============================== rendering: list views ============================== */

  function renderAll(){
    renderHeader();
    if(state.tab === "active") renderActive(); else renderArchive();
    renderDrawer();
  }

  function renderHeader(){
    var active = state.properties.filter(function(p){ return p.status !== "archived"; });
    var overdue = active.filter(function(p){ return bucketOf(p) === "overdue"; }).length;
    document.getElementById("headerCount").textContent =
      active.length + " active" + (overdue ? " · " + overdue + " overdue" : "");
  }

  function matchesSearch(p){
    if(!state.search) return true;
    return (p.address||"").toLowerCase().indexOf(state.search.toLowerCase()) !== -1;
  }

  function renderActive(){
    var root = document.getElementById("mainActive");
    var items = state.properties.filter(function(p){ return p.status !== "archived" && matchesSearch(p); });
    if(!items.length){
      root.innerHTML = '<div class="empty">'+(state.search ? "No active properties match “"+escapeHtml(state.search)+"”." : "No active lost managements right now. Add one with “+ New property”.")+'</div>';
      return;
    }
    var groups = {};
    items.forEach(function(p){ var b = bucketOf(p); (groups[b]=groups[b]||[]).push(p); });
    var html = "";
    BUCKET_ORDER.forEach(function(b){
      if(!groups[b]) return;
      var list = groups[b].slice().sort(function(a,c){ return (a.terminationDate||"9999").localeCompare(c.terminationDate||"9999") || a.address.localeCompare(c.address); });
      var headClass = b === "overdue" ? "overdue" : (b === "thismonth" ? "soon" : "");
      html += '<div class="bucket"><div class="bucket-head '+headClass+'"><h2>'+BUCKET_LABEL[b]+'</h2><span class="count">'+list.length+'</span></div><div class="grid">';
      list.forEach(function(p){ html += cardHtml(p, b); });
      html += '</div></div>';
    });
    root.innerHTML = html;
    root.querySelectorAll("[data-open]").forEach(function(el){
      el.addEventListener("click", function(){ openDrawer(el.getAttribute("data-open")); });
    });
  }

  function cardHtml(p, bucket){
    var prog = progressOf(p);
    var pillClass = bucket === "overdue" ? "overdue" : (bucket === "thismonth" ? "soon" : (bucket === "nodate" ? "none" : "later"));
    var outcomeBadge = "";
    if(p.templateType !== "room"){
      if(p.outcome === "sold") outcomeBadge = '<span class="pill outcome-sold">Selling</span>';
      else if(p.outcome === "notSold") outcomeBadge = '<span class="pill outcome-notSold">Not selling</span>';
    }
    var importedBadge = p.imported ? '<span class="pill imported" title="Migrated from Trello">Migrated</span>' : "";
    var assignedBadge = p.assignedTo ? '<span class="pill assigned">'+escapeHtml(p.assignedTo.name)+'</span>' : '<span class="pill none">Unassigned</span>';
    return (
      '<button class="card" data-open="'+p.id+'">' +
        '<div class="card-top"><span class="card-address">'+escapeHtml(p.address||"(no address)")+'</span>' +
          '<span class="pill '+pillClass+'">'+escapeHtml(fmtDate(p.terminationDate))+'</span></div>' +
        '<div class="progress-row"><div class="progress-track"><div class="progress-fill" style="width:'+prog.pct+'%"></div></div>' +
          '<span class="progress-label tabular">'+prog.done+'/'+prog.total+'</span></div>' +
        '<div class="card-meta"><span>'+assignedBadge+' '+outcomeBadge+' '+importedBadge+'</span>' +
          '<span>'+((p.comments||[]).length ? (p.comments.length + " note"+(p.comments.length>1?"s":"")) : "")+'</span></div>' +
      '</button>'
    );
  }

  function renderArchive(){
    var root = document.getElementById("mainArchive");
    var items = state.properties.filter(function(p){ return p.status === "archived" && matchesSearch(p); });
    if(!items.length){
      root.innerHTML = '<div class="empty">'+(state.search ? "No archived properties match “"+escapeHtml(state.search)+"”." : "Nothing archived yet. Completed lost managements move here.")+'</div>';
      return;
    }
    items.sort(function(a,b){ return (b.terminationDate||"").localeCompare(a.terminationDate||""); });
    var html = '<div class="archive-list">';
    items.forEach(function(p){
      var outcomeLabel = p.outcome === "sold" ? "Sold" : p.outcome === "notSold" ? "Not sold" : "";
      html += '<div class="arow" data-open="'+p.id+'">' +
        '<span class="addr">'+escapeHtml(p.address||"(no address)")+(p.imported ? ' <span class="pill imported">Migrated</span>' : '')+'</span>' +
        '<span class="date tabular">'+escapeHtml(fmtDate(p.terminationDate))+'</span>' +
        '<span class="outcome-cell">'+escapeHtml(outcomeLabel)+'</span>' +
        '<span aria-hidden="true">›</span>' +
      '</div>';
    });
    html += '</div>';
    root.innerHTML = html;
    root.querySelectorAll("[data-open]").forEach(function(el){
      el.addEventListener("click", function(){ openDrawer(el.getAttribute("data-open")); });
    });
  }

  /* ============================== drawer (property detail) ============================== */

  var collapsedSections = {};

  function openDrawer(id){
    state.drawerId = id;
    document.getElementById("scrim").classList.add("open");
    document.getElementById("drawer").classList.add("open");
    document.getElementById("drawer").setAttribute("aria-hidden","false");
    renderDrawer();
  }
  function closeDrawer(){
    state.drawerId = null;
    document.getElementById("scrim").classList.remove("open");
    document.getElementById("drawer").classList.remove("open");
    document.getElementById("drawer").setAttribute("aria-hidden","true");
  }

  function renderDrawer(){
    var el = document.getElementById("drawer");
    if(!state.drawerId){ return; }
    var p = findProp(state.drawerId);
    if(!p){ closeDrawer(); return; }
    var prog = progressOf(p);
    var isRoom = p.templateType === "room";

    var html = "";
    html += '<div class="drawer-head">' +
      '<div style="flex:1;">' +
        '<input class="addr-input" id="drawerAddr" type="text" value="'+escapeHtml(p.address||"")+'" aria-label="Property address">' +
        '<div class="name-hint">Progress: '+prog.done+'/'+prog.total+' tasks · '+(p.status==="archived" ? "Archived "+fmtDate((p.archivedAt||"").slice(0,10)) : BUCKET_LABEL[bucketOf(p)])+'</div>' +
      '</div>' +
      '<button class="btn ghost" id="drawerClose" aria-label="Close">✕</button>' +
    '</div>';

    html += '<div class="drawer-body">';

    html += '<div class="field-row">' +
      '<div class="field"><label class="field-label" for="fNotice">Notice received</label><input type="date" id="fNotice" value="'+escapeHtml(p.noticeReceivedDate||"")+'"></div>' +
      '<div class="field"><label class="field-label" for="fTermination">Termination date</label><input type="date" id="fTermination" value="'+escapeHtml(p.terminationDate||"")+'"></div>' +
    '</div>';
    var assigneeMissing = p.assignedTo && !staffByEmail(p.assignedTo.email);
    html += '<div class="field"><div class="pm-label-row"><label class="field-label" for="fAssignee">Property manager</label>' +
      '<button type="button" class="link-btn" id="manageStaffBtn" title="Admin only">Edit list</button></div>' +
      '<select id="fAssignee" style="width:100%;border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:8px 10px;color:var(--text);">' +
        '<option value="">Unassigned</option>' +
        (assigneeMissing ? '<option value="'+escapeHtml(p.assignedTo.email)+'" selected>'+escapeHtml(p.assignedTo.name)+' (no longer on list)</option>' : '') +
        STAFF.map(function(s){
          return '<option value="'+escapeHtml(s.email)+'" '+((p.assignedTo && p.assignedTo.email===s.email)?"selected":"")+'>'+escapeHtml(s.name)+'</option>';
        }).join("") +
      '</select>';
    if(p.assignedTo){
      var first = (p.assignedTo.name || "").split(" ")[0];
      html += '<div class="email-row" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">' +
        '<a class="btn" style="text-decoration:none;display:inline-block;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:7px 12px;font-weight:600;font-size:13px;" href="'+escapeHtml(outlookWebHref(p, p.assignedTo))+'" target="_blank" rel="noopener">Email '+escapeHtml(first)+' (Outlook web)</a>' +
        '<a class="btn" style="text-decoration:none;display:inline-block;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:7px;padding:7px 12px;font-weight:600;font-size:13px;" href="'+escapeHtml(mailtoHref(p, p.assignedTo))+'">Open in mail app</a>' +
        '</div>';
    }
    html += '</div>';

    html += '<div class="field"><label class="field-label" for="fReason">Reason for loss</label><textarea id="fReason" placeholder="What happened?">'+escapeHtml(p.reasonForLoss||"")+'</textarea></div>';

    if(!isRoom){
      html += '<div class="field"><label class="field-label">Outcome</label>' +
        '<div class="segmented" id="outcomeSeg">' +
          '<button data-v="unknown" class="'+(p.outcome==="unknown"||!p.outcome?"active":"")+'">Not decided</button>' +
          '<button data-v="sold" class="'+(p.outcome==="sold"?"active":"")+'">Selling</button>' +
          '<button data-v="notSold" class="'+(p.outcome==="notSold"?"active":"")+'">Not selling</button>' +
        '</div></div>';
    }

    visibleChecklists(p).forEach(function(c){
      var done = (c.items||[]).filter(function(i){return i.done;}).length;
      var total = (c.items||[]).length;
      var collapseKey = p.id+":"+c.key;
      var collapsed = !!collapsedSections[collapseKey];
      html += '<div class="section'+(collapsed?" collapsed":"")+'" data-section="'+c.key+'">' +
        '<div class="section-head" data-toggle="'+collapseKey+'">' +
          '<h3>'+escapeHtml(c.title)+'</h3>' +
          '<div class="meta"><span class="frac tabular">'+done+'/'+total+'</span><span class="chev">▾</span></div>' +
        '</div>' +
        '<div class="section-items">';
      (c.items||[]).forEach(function(item, idx){
        html += '<div class="item-row'+(item.done?" done":"")+'">' +
          '<input type="checkbox" data-check="'+c.key+':'+idx+'" '+(item.done?"checked":"")+'>' +
          '<div style="flex:1;"><div class="item-text">'+escapeHtml(item.text)+'</div>' +
          (item.done && item.doneBy ? '<div class="item-done-meta">Done by '+escapeHtml(item.doneBy)+(item.doneAt?" · "+fmtDateTime(item.doneAt):"")+'</div>' : '') +
          '</div>' +
          '<button class="item-remove" data-removeitem="'+c.key+':'+idx+'" aria-label="Remove item">✕</button>' +
        '</div>';
      });
      html += '</div>' +
        '<div class="add-item-row"><input type="text" placeholder="Add an item…" data-additem="'+c.key+'"></div>' +
      '</div>';
    });

    html += '<div>' +
      '<label class="field-label">Notes &amp; updates</label>';
    (p.comments||[]).forEach(function(c){
      html += '<div class="comment"><span class="who">'+escapeHtml(c.author||"Someone")+'</span><span class="when">'+fmtDateTime(c.at)+'</span><div class="body">'+escapeHtml(c.text)+'</div></div>';
    });
    html += '<div class="comment-add"><textarea id="newComment" placeholder="Add a note for the team…"></textarea>' +
      '<button class="btn" id="addCommentBtn">Add</button></div>' +
    '</div>';

    html += '</div>'; // drawer-body

    html += '<div class="drawer-footer">' +
      '<button class="btn danger ghost" id="deletePropBtn">Delete</button>' +
      (p.status === "archived"
        ? '<button class="btn primary" id="reopenBtn">Reopen</button>'
        : '<button class="btn primary" id="archiveBtn">Archive property</button>') +
    '</div>';

    var prevBody = el.querySelector(".drawer-body");
    var prevScrollTop = prevBody ? prevBody.scrollTop : 0;

    el.innerHTML = html;

    var newBody = el.querySelector(".drawer-body");
    if(newBody) newBody.scrollTop = prevScrollTop;

    document.getElementById("drawerClose").addEventListener("click", closeDrawer);

    var addrInput = document.getElementById("drawerAddr");
    addrInput.addEventListener("change", function(){ patchProperty(p.id, {address: addrInput.value.trim(), updatedAt: nowIso()}); });

    document.getElementById("fNotice").addEventListener("change", function(e){ patchProperty(p.id, {noticeReceivedDate: e.target.value, updatedAt: nowIso()}); });
    document.getElementById("fTermination").addEventListener("change", function(e){ patchProperty(p.id, {terminationDate: e.target.value, updatedAt: nowIso()}); });
    document.getElementById("fReason").addEventListener("change", function(e){ patchProperty(p.id, {reasonForLoss: e.target.value, updatedAt: nowIso()}); });

    document.getElementById("manageStaffBtn").addEventListener("click", openStaffManager);
    var assigneeSel = document.getElementById("fAssignee");
    assigneeSel.addEventListener("change", function(){
      var email = assigneeSel.value;
      if(!email){
        patchProperty(p.id, {assignedTo: null, updatedAt: nowIso()});
        return;
      }
      var staff = staffByEmail(email);
      if(!staff) return;
      staff = { name: staff.name, email: staff.email };
      patchProperty(p.id, {assignedTo: staff, updatedAt: nowIso()});
      toast("Assigned to " + staff.name + " — press “Email " + staff.name.split(" ")[0] + "” to notify them");
    });

    var seg = document.getElementById("outcomeSeg");
    if(seg){
      seg.querySelectorAll("button").forEach(function(b){
        b.addEventListener("click", function(){ patchProperty(p.id, {outcome: b.getAttribute("data-v"), updatedAt: nowIso()}); });
      });
    }

    el.querySelectorAll("[data-toggle]").forEach(function(h){
      h.addEventListener("click", function(){
        var k = h.getAttribute("data-toggle");
        collapsedSections[k] = !collapsedSections[k];
        renderDrawer();
      });
    });

    el.querySelectorAll("[data-check]").forEach(function(cb){
      cb.addEventListener("change", function(){
        var parts = cb.getAttribute("data-check").split(":");
        var key = parts[0], idx = parseInt(parts[1],10);
        var checklists = JSON.parse(JSON.stringify(p.checklists||[]));
        var section = checklists.find(function(s){ return s.key===key; });
        if(!section) return;
        var item = section.items[idx];
        item.done = cb.checked;
        item.doneBy = cb.checked ? (getYou()||"Someone") : "";
        item.doneAt = cb.checked ? nowIso() : "";
        patchProperty(p.id, {checklists: checklists, updatedAt: nowIso()});
      });
    });

    el.querySelectorAll("[data-removeitem]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var parts = btn.getAttribute("data-removeitem").split(":");
        var key = parts[0], idx = parseInt(parts[1],10);
        var checklists = JSON.parse(JSON.stringify(p.checklists||[]));
        var section = checklists.find(function(s){ return s.key===key; });
        if(!section) return;
        section.items.splice(idx,1);
        patchProperty(p.id, {checklists: checklists, updatedAt: nowIso()});
      });
    });

    el.querySelectorAll("[data-additem]").forEach(function(inp){
      inp.addEventListener("keydown", function(e){
        if(e.key !== "Enter") return;
        var val = inp.value.trim();
        if(!val) return;
        var key = inp.getAttribute("data-additem");
        var checklists = JSON.parse(JSON.stringify(p.checklists||[]));
        var section = checklists.find(function(s){ return s.key===key; });
        if(!section) return;
        section.items.push({text: val, done:false, doneBy:"", doneAt:""});
        patchProperty(p.id, {checklists: checklists, updatedAt: nowIso()});
        inp.value = "";
      });
    });

    document.getElementById("addCommentBtn").addEventListener("click", function(){
      var ta = document.getElementById("newComment");
      var val = ta.value.trim();
      if(!val) return;
      var comments = (p.comments||[]).slice();
      comments.unshift({author: getYou()||"Someone", text: val, at: nowIso()});
      patchProperty(p.id, {comments: comments, updatedAt: nowIso()});
      ta.value = "";
    });

    document.getElementById("archiveBtn").addEventListener("click", function(){
      patchProperty(p.id, {status:"archived", archivedAt: nowIso(), archivedBy: getYou()||"Someone", updatedAt: nowIso()});
      toast("Archived");
    });
    var reopenBtn = document.getElementById("reopenBtn");
    if(reopenBtn){
      reopenBtn.addEventListener("click", function(){
        patchProperty(p.id, {status:"active", archivedAt:"", archivedBy:"", updatedAt: nowIso()});
        toast("Reopened");
      });
    }
    document.getElementById("deletePropBtn").addEventListener("click", function(){
      if(!confirm("Delete "+(p.address||"this property")+"? This can’t be undone.")) return;
      deleteProperty(p.id);
      closeDrawer();
    });
  }

  /* ============================== property manager list (admin only) ============================== */

  function openStaffManager(){
    if(!settings.adminPinHash) return openPinModal("set");
    if(isUnlocked()) return openStaffModal();
    openPinModal("enter");
  }

  function openPinModal(mode){
    var root = document.getElementById("modalRoot");
    var setting = mode === "set" || mode === "change";
    root.innerHTML =
      '<div class="modal-scrim" id="pinScrim"><div class="modal" role="dialog" aria-label="Admin PIN">' +
        '<h2>'+(mode==="set" ? "Create admin PIN" : mode==="change" ? "Change admin PIN" : "Admin PIN")+'</h2>' +
        '<div style="font-size:13px;color:var(--text-muted);">'+(setting
          ? "Only someone with this PIN can add or remove property managers. Choose at least 4 characters and keep it to yourself."
          : "Editing the property manager list is limited to the admin.")+'</div>' +
        '<div class="field"><label class="field-label" for="pin1">'+(setting?"New PIN":"PIN")+'</label><input type="password" id="pin1" autocomplete="off"></div>' +
        (setting ? '<div class="field"><label class="field-label" for="pin2">Type it again</label><input type="password" id="pin2" autocomplete="off"></div>' : '') +
        '<div class="pin-error" id="pinErr"></div>' +
        '<div class="modal-actions"><button class="btn ghost" id="pinCancel">Cancel</button><button class="btn primary" id="pinOk">'+(setting?"Save PIN":"Unlock")+'</button></div>' +
      '</div></div>';
    var close = function(){ root.innerHTML = ""; };
    document.getElementById("pinScrim").addEventListener("click", function(e){ if(e.target.id==="pinScrim") close(); });
    document.getElementById("pinCancel").addEventListener("click", close);
    var err = document.getElementById("pinErr");
    async function submit(){
      var a = document.getElementById("pin1").value;
      if(setting){
        var b = document.getElementById("pin2").value;
        if(a.length < 4){ err.textContent = "Use at least 4 characters."; return; }
        if(a !== b){ err.textContent = "The two PINs don’t match."; return; }
        var h = await sha256(a);
        var patch = { adminPinHash: h };
        if(!settings.staff) patch.staff = STAFF.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
        if(await saveSettings(patch)){
          settings.adminPinHash = h; if(patch.staff) settings.staff = patch.staff;
          setUnlocked(); toast(mode==="set" ? "PIN created" : "PIN changed"); openStaffModal();
        }
      } else {
        if(await sha256(a) === settings.adminPinHash){ setUnlocked(); openStaffModal(); }
        else { err.textContent = "That PIN isn’t right."; document.getElementById("pin1").select(); }
      }
    }
    document.getElementById("pinOk").addEventListener("click", submit);
    root.querySelectorAll("input").forEach(function(i){ i.addEventListener("keydown", function(e){ if(e.key==="Enter") submit(); }); });
    document.getElementById("pin1").focus();
  }

  function openStaffModal(){
    var root = document.getElementById("modalRoot");
    root.innerHTML =
      '<div class="modal-scrim" id="smScrim"><div class="modal" role="dialog" aria-label="Property managers" style="width:min(500px,100%);">' +
        '<h2>Property managers</h2>' +
        '<div class="staff-list" id="staffList"></div>' +
        '<div style="font-weight:700;font-size:13px;margin-top:4px;">Add someone</div>' +
        '<div class="field"><label class="field-label" for="smName">Full name</label><input type="text" id="smName" placeholder="e.g. Jane Smith"></div>' +
        '<div class="field"><label class="field-label" for="smEmail">Email</label><input type="email" id="smEmail" placeholder="jane@wre.co.nz"></div>' +
        '<div class="pin-error" id="smErr"></div>' +
        '<div class="modal-actions" style="justify-content:space-between;">' +
          '<span><button class="link-btn" id="smChangePin">Change PIN</button> &nbsp; <button class="link-btn" id="smLock">Lock</button></span>' +
          '<span style="display:flex;gap:8px;"><button class="btn ghost" id="smClose">Done</button><button class="btn primary" id="smAdd">Add</button></span>' +
        '</div>' +
      '</div></div>';
    renderStaffModalList();
    var close = function(){ root.innerHTML = ""; };
    document.getElementById("smScrim").addEventListener("click", function(e){ if(e.target.id==="smScrim") close(); });
    document.getElementById("smClose").addEventListener("click", close);
    document.getElementById("smChangePin").addEventListener("click", function(){ openPinModal("change"); });
    document.getElementById("smLock").addEventListener("click", function(){ try{ sessionStorage.removeItem(ADMIN_KEY); }catch(e){} close(); toast("Locked"); });
    async function add(){
      var err = document.getElementById("smErr");
      var name = document.getElementById("smName").value.trim().replace(/\s+/g," ");
      var email = document.getElementById("smEmail").value.trim().toLowerCase();
      if(!name){ err.textContent = "Add a name."; return; }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.textContent = "That email doesn’t look right."; return; }
      if(staffByEmail(email)){ err.textContent = "Someone with that email is already on the list."; return; }
      var list = STAFF.concat([{name:name, email:email}]).sort(function(a,b){ return a.name.localeCompare(b.name); });
      if(await saveSettings({staff:list})){
        STAFF = list; settings.staff = list;
        document.getElementById("smName").value = ""; document.getElementById("smEmail").value = ""; err.textContent = "";
        renderStaffModalList(); renderDrawer(); toast(name + " added");
        document.getElementById("smName").focus();
      }
    }
    document.getElementById("smAdd").addEventListener("click", add);
    ["smName","smEmail"].forEach(function(id){ document.getElementById(id).addEventListener("keydown", function(e){ if(e.key==="Enter") add(); }); });
  }

  function renderStaffModalList(){
    var box = document.getElementById("staffList");
    if(!box) return;
    if(!STAFF.length){ box.innerHTML = '<div style="padding:8px;color:var(--text-muted);font-size:13px;">No one on the list yet.</div>'; return; }
    box.innerHTML = STAFF.map(function(s){
      var n = state.properties.filter(function(p){ return p.status !== "archived" && p.assignedTo && p.assignedTo.email === s.email; }).length;
      return '<div class="staff-row"><div class="who"><div>'+escapeHtml(s.name)+(n ? ' <span class="pill assigned" style="margin-left:4px;">'+n+' active</span>' : '')+'</div><div class="em">'+escapeHtml(s.email)+'</div></div>' +
        '<button data-email="'+escapeHtml(s.email)+'">Remove</button></div>';
    }).join("");
    box.querySelectorAll("button[data-email]").forEach(function(b){
      b.addEventListener("click", async function(){
        var s = staffByEmail(b.getAttribute("data-email"));
        if(!s) return;
        var n = state.properties.filter(function(p){ return p.status !== "archived" && p.assignedTo && p.assignedTo.email === s.email; }).length;
        if(!confirm("Remove " + s.name + " from the list?" + (n ? "\n\nThey’re still assigned to " + n + " active propert" + (n===1?"y":"ies") + " — those stay assigned to them until you change them." : ""))) return;
        var list = STAFF.filter(function(x){ return x.email !== s.email; });
        if(await saveSettings({staff:list})){
          STAFF = list; settings.staff = list;
          renderStaffModalList(); renderDrawer(); toast(s.name + " removed");
        }
      });
    });
  }

  /* ============================== new-property modal ============================== */

  function openNewPropertyModal(){
    var root = document.getElementById("modalRoot");
    root.innerHTML =
      '<div class="modal-scrim" id="npScrim">' +
        '<div class="modal" role="dialog" aria-label="New property">' +
          '<h2>New lost management</h2>' +
          '<div class="field"><label class="field-label" for="npAddress">Address</label><input type="text" id="npAddress" placeholder="e.g. 24 Mangaone Street"></div>' +
          '<div class="field"><label class="field-label" for="npType">Checklist template</label>' +
            '<select id="npType" style="border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:8px 10px;">' +
              '<option value="standard">Standard tenancy</option>' +
              '<option value="room">Room for rent</option>' +
            '</select></div>' +
          '<div class="field-row">' +
            '<div class="field"><label class="field-label" for="npNotice">Notice received</label><input type="date" id="npNotice"></div>' +
            '<div class="field"><label class="field-label" for="npTermination">Termination date</label><input type="date" id="npTermination"></div>' +
          '</div>' +
          '<div class="modal-actions">' +
            '<button class="btn ghost" id="npCancel">Cancel</button>' +
            '<button class="btn primary" id="npCreate">Add property</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById("npScrim").addEventListener("click", function(e){ if(e.target.id==="npScrim") root.innerHTML=""; });
    document.getElementById("npCancel").addEventListener("click", function(){ root.innerHTML=""; });
    document.getElementById("npCreate").addEventListener("click", function(){
      var address = document.getElementById("npAddress").value.trim();
      if(!address){ toast("Add an address first"); return; }
      var type = document.getElementById("npType").value;
      var data = {
        address: address,
        templateType: type,
        status: "active",
        outcome: "unknown",
        noticeReceivedDate: document.getElementById("npNotice").value || "",
        terminationDate: document.getElementById("npTermination").value || "",
        reasonForLoss: "",
        assignedTo: null,
        checklists: templateFor(type),
        comments: [],
        imported: false,
        createdAt: nowIso(),
        createdBy: getYou()||"Someone",
        updatedAt: nowIso()
      };
      createProperty(data);
      root.innerHTML = "";
    });
    document.getElementById("npAddress").focus();
  }

  /* ============================== wiring ============================== */

  document.getElementById("tabActiveBtn").addEventListener("click", function(){
    state.tab = "active";
    this.classList.add("active"); this.setAttribute("aria-selected","true");
    document.getElementById("tabArchiveBtn").classList.remove("active");
    document.getElementById("tabArchiveBtn").setAttribute("aria-selected","false");
    document.getElementById("mainActive").style.display = "";
    document.getElementById("mainArchive").style.display = "none";
    renderAll();
  });
  document.getElementById("tabArchiveBtn").addEventListener("click", function(){
    state.tab = "archive";
    this.classList.add("active"); this.setAttribute("aria-selected","true");
    document.getElementById("tabActiveBtn").classList.remove("active");
    document.getElementById("tabActiveBtn").setAttribute("aria-selected","false");
    document.getElementById("mainActive").style.display = "none";
    document.getElementById("mainArchive").style.display = "";
    renderAll();
  });
  document.getElementById("searchInput").addEventListener("input", function(e){
    state.search = e.target.value;
    renderAll();
  });
  document.getElementById("newPropertyBtn").addEventListener("click", openNewPropertyModal);
  document.getElementById("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeDrawer(); });

  var youInput = document.getElementById("youInput");
  youInput.value = getYou();
  youInput.addEventListener("change", function(){ setYou(youInput.value.trim()); });

  initDb();

  /* ============================== one-time Trello migration ============================== */
  /* Visiting this page with ?migrate=1 imports the properties saved from the old Trello   */
  /* board, but only if the "properties" collection is currently empty — so it is safe and */
  /* can never be run twice by accident. It has no effect on the normal page.               */

  function runMigrationIfRequested(){
    if(location.search.indexOf("migrate=1") === -1) return;
    var box = document.createElement("div");
    box.className = "migrate-box";
    box.innerHTML = "<h1>Importing Trello data…</h1><div class='migrate-log' id='migrateLog'>Starting…</div>";
    document.getElementById("mainApp").innerHTML = "";
    document.getElementById("mainApp").appendChild(box);
    var log = document.getElementById("migrateLog");
    function say(t){ log.textContent += "\n" + t; log.scrollTop = log.scrollHeight; }

    var db = firebase.firestore();
    db.collection("properties").limit(1).get().then(function(snap){
      if(!snap.empty){
        say("The properties collection already has data in it — skipping import so nothing is duplicated.");
        return;
      }
      say("Collection is empty. Fetching seed-data.json…");
      fetch("seed-data.json").then(function(r){ return r.json(); }).then(function(records){
        say("Loaded " + records.length + " records. Writing to Firestore…");
        var i = 0;
        function next(){
          if(i >= records.length){ say("Done! Imported " + records.length + " properties. You can remove ?migrate=1 from the address bar now."); return; }
          var rec = records[i];
          db.collection("properties").doc(rec.id).set(rec.data).then(function(){
            i++;
            if(i % 25 === 0 || i === records.length) say("Imported " + i + " / " + records.length);
            next();
          }).catch(function(err){
            say("Error on " + rec.id + ": " + err.message);
            i++;
            next();
          });
        }
        next();
      }).catch(function(err){ say("Couldn't load seed-data.json: " + err.message); });
    }).catch(function(err){ say("Couldn't reach Firestore: " + err.message); });
  }
  runMigrationIfRequested();

})();
</script>
